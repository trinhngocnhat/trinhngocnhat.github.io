<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trịnh Ngọc Nhát - Personal Profile & Portfolio | Aspiring Backend Developer. Select your preferred language (English / Tiếng Việt).">
    <meta name="google-site-verification" content="X9bzEYSVeZ4Wumr9RL7InZdY4B2abW9GRIvkGgvxtYM" />

    <title>Trịnh Ngọc Nhát | Personal Profile & Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="icon" href="assets/images/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Shared Modules -->
    <script src="assets/js/bridge.js"></script>
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/components.js" defer></script>
    <script src="assets/js/app.js" defer></script>
    <script>
        // Automatic routing to preferred language version upon entry
        document.addEventListener('DOMContentLoaded', () => {
            if (window.languageManager) {
                window.languageManager.autoRoute();
            }
        });
    </script>
</head>

<body data-page="home">

    <!-- Shared Header Component Placeholder -->
    <div id="site-header"></div>

    <div class="container">
        <main class="profile-card" role="main">
            <!-- Shared Sidebar Component Placeholder -->
            <div id="site-sidebar"></div>

            <section class="main-content">
                <section class="section">
                    <div class="section-title">
                        <div class="title-icon">🌐</div>
                        <h2>Select Language / Chọn ngôn ngữ</h2>
                    </div>
                    <p class="about-text">
                        Welcome to my personal profile website. Please select your preferred language below:
                    </p>
                    <p class="about-text" style="margin-top: 6px;">
                        Chào mừng bạn đến với trang cá nhân của tôi. Vui lòng chọn ngôn ngữ hiển thị:
                    </p>
                    <div class="cta-group" style="margin-top: 28px;">
                        <a href="en/index.html" class="btn-primary" onclick="if(window.languageManager) { window.languageManager.changeLanguage('en'); }">
                            🇬🇧 English Version →
                        </a>
                        <a href="vi/index.html" class="btn-primary btn-outline" onclick="if(window.languageManager) { window.languageManager.changeLanguage('vi'); }">
                            🇻🇳 Phiên bản Tiếng Việt →
                        </a>
                    </div>
                </section>
            </section>
        </main>

        <!-- Shared Footer Component Placeholder -->
        <div id="site-footer"></div>
    </div>

</body>

</html>
